          - "81:CA:3A:B3:86:5C:E0:4D:CC:7F:D6:C5:5D:0A:D0:90:9B:70:D7:81:42:AB:52:C1:1C:5B:26:0C:1D:4C:1F:B4"
    - relation:
        - "delegate_permission/common.handle_all_urls"
        - "delegate_permission/common.get_login_creds"
      target:
        namespace: android_app
        package_name: com.onramp.app.debug
        sha256_cert_fingerprints:
          - "3D:32:4B:D8:E9:58:85:DE:2B:86:CB:2B:4F:BA:0C:4D:2F:E4:B4:FA:43:52:36:B2:C8:BB:F7:C7:2B:67:3E:AF"
          - "DF:85:17:C2:72:C8:3D:BD:1B:FD:C8:17:58:41:80:E5:A6:33:B7:96:F7:4A:D8:AA:C0:33:8A:E8:1A:CD:F0:38"
          - "76:7B:FF:75:D7:5A:F8:F5:89:5C:96:00:D8:C0:C7:F2:BB:7D:BD:F3:C4:C1:05:AA:34:B0:CA:6C:33:2E:6F:59"
          - "FA:C6:17:45:DC:09:03:78:6F:B9:ED:E6:2A:96:2B:39:9F:73:48:F0:BB:6F:89:9B:83:32:66:75:91:03:3B:9C"
          - "B5:F1:2F:27:66:D6:73:96:09:03:7B:ED:F6:9C:62:B6:02:0F:B5:B1:22:8A:39:CF:B0:0F:FD:61:97:FE:B1:FF"

# Every field here is the upstream default EXCEPT balance_check_interval; the
# struct has no per-field serde defaults, so a partial block fails to parse.
transactions:
  max_pending_transactions: 100
  max_transactions_per_signer: 16
  max_queued_per_eoa: 1
  # 300s, not the 5s default. Each tick costs eth_getBalance + eth_feeHistory PER
  # SIGNER PER CHAIN, and it runs whether or not anyone is using the app - at 3
  # signers x 5 chains the default was 1.35 req/s per chain, ~7M requests/month
  # against the two QuickNode endpoints (Base 8453 + Polygon 137) alone, ~88% of
  # all relay RPC traffic. 60s cut that 12x; 300s cuts it 60x (~0.02 req/s per
  # chain). The check only gates how fast a drained signer is paused and topped
  # up from the funder, and how fast a paused signer resumes after a manual
  # top-up - both now up to 5 min. Free at our volume; revisit if signers start
  # actually draining.
  balance_check_interval: 300
  # 300s, not 60s: one eth_getTransactionCount per signer per chain per tick.
  # The send path now resyncs by itself when a nonce is already taken (e.g. by
  # staging, which signs with the same keys) and resends the intent, so this
  # loop is only a backstop.
  nonce_check_interval: 300
  transaction_timeout: 60
  public_node_endpoints: {}

chains:
  # Base Sepolia, PAUSED 2026-09-10 to cut idle RPC spend: staging points it at a
  # paid QuickNode endpoint, and every configured chain pays the signer and
  # metrics pollers whether or not anyone uses it. Rise testnet stays up. To
  # restore, uncomment this block, the 84532 entry under chain_sponsorship, and
  # add 84532 back to sponsorship.sponsored_chains.
  # 84532:
  #   endpoint: "https://sepolia.base.org"
  #   sim_mode: trace
  #   assets:
  #     ethereum:
  #       address: "0x0000000000000000000000000000000000000000"
  #       fee_token: true
  #   signers:
  #     num_signers: 3
  # Rise testnet. Our uniform contract set is deployed here too (CREATE2 -> same
  # top-level addresses as Base Sepolia). Public RPC, no secret in the image.
  11155931:
    endpoint: "https://indexing.testnet.riselabs.xyz"
    sim_mode: trace
    assets:
      ethereum:
        address: "0x0000000000000000000000000000000000000000"
        fee_token: true
      # RiseX production testnet USDC. uid MUST be the CoinGecko coin id so the
      # price fetcher resolves fiat; decimals verified on-chain (6). fee_token
      # is inert while sponsorship.sponsor_all is true, but makes getAssets
      # enumerate the balance for wallets holding it.
      usd-coin:
        address: "0x8d17fC7Db6b4FCf40AFB296354883DEC95a12f58"
        decimals: 6
        fee_token: true
    signers:
      num_signers: 3
  # --- Mainnet (uniform contract set deployed + funded on all three, 2026-07-17).
  # endpoint below is a public fallback; RPC_<chainId> env overrides with the keyed
  # provider URL at boot. LZ interop is configured on-chain but not yet enabled here.
  # Base mainnet.
  8453:
    endpoint: "https://mainnet.base.org"
    sim_mode: simulatev1
    assets:
      ethereum:
        address: "0x0000000000000000000000000000000000000000"
        fee_token: true
      # Circle USDC on Base. fee_token so a session key may nominate it (oportet
      # infers the fee token from spend[0]); uid = CoinGecko id for the oracle.
      usd-coin:
        address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
        decimals: 6
        fee_token: true
    signers:
      num_signers: 3
  # Polygon mainnet. Native gas asset is POL.
  137:
    endpoint: "https://polygon-rpc.com"
    sim_mode: simulatev1
    assets:
      pol:
        address: "0x0000000000000000000000000000000000000000"
        fee_token: true
      # Circle USDC (native) and USDC.e (bridged, Polymarket collateral), both
      # fee tokens; distinct CoinGecko ids so each prices on its own.
      usd-coin:
        address: "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"
        decimals: 6
        fee_token: true
      bridged-usdc-polygon-pos-bridge:
        address: "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174"
        decimals: 6
        fee_token: true
    signers:
      num_signers: 3
  # Rise mainnet. Keyed RPC supports eth_simulateV1 (probed), so simulatev1 like
  # the other mainnets; only the public-RPC testnets fall back to trace.
  4153:
    endpoint: "https://rpc.risechain.com"
    sim_mode: simulatev1
    assets:
      ethereum:
        address: "0x0000000000000000000000000000000000000000"
        fee_token: true
      # RiseX mainnet USDC.e (the system-config quote token); decimals read
      # on-chain (6), symbol USDC.e. uid = CoinGecko id for the oracle.
      usd-coin:
        address: "0xe436820ba0C69702c1d3E601d421c0eF38262739"
        decimals: 6
        fee_token: true
    signers:
      num_signers: 3
  # --- Planned mainnets, COMMENTED OUT until the uniform contract set is
  # deployed on them (same CREATE2 addresses as the top of this file). To enable
  # one: deploy, register the signers as gas wallets in SimpleFunder
  # (setGasWallet), fund the funder and the signers on that chain, set
  # RPC_<chainId> on the Railway service to the QuickNode multichain URL
  # (Infisical /relay, prod) the way RPC_8453 gets RPC_URL_BASE, then uncomment
  # its block. Boot diagnostics refuse to start the relay if a signer is not a
  # gas wallet, the funder holds no native token, or a contract's EIP-712
  # domain does not match, and they read all of it through Multicall3. Neither
  # is in sponsorship.sponsored_chains, so users pay their own fees in the fee
  # tokens below until a chain_sponsorship entry is sized for the chain.
  # Token addresses, symbols and decimals were read on-chain on 2026-09-10, and
  # eth_simulateV1 was probed on both through the QuickNode endpoint.
  #
  # Ethereum mainnet. An L1, so l1_fee auto resolves to none. At 12s blocks the
  # default watch window (two blocks) needs no floor, and a sync send would hold
  # a request open for a whole block, so it stays off.
  1:
    endpoint: "https://ethereum-rpc.publicnode.com"
    sim_mode: simulatev1
    assets:
      ethereum:
        address: "0x0000000000000000000000000000000000000000"
        fee_token: true
      usd-coin:
        address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
        decimals: 6
        fee_token: true
    signers:
      num_signers: 3
  # Robinhood Chain mainnet: Arbitrum Orbit, gas in ETH, 100ms blocks.
  # alloy-chains has no entry for 4663, so l1_fee must say arbitrum: auto would
  # warn at boot and quote no L1 fee. At 100ms blocks the watcher would fetch
  # about ten blocks a second per pending transaction, so sends go through
  # eth_sendRawTransactionSync and the watch window gets a 2s floor; two blocks
  # (200ms) is shorter than a normal inclusion.
  4663:
    endpoint: "https://rpc.mainnet.chain.robinhood.com"
    sim_mode: simulatev1
    send_raw_transaction_sync: true
    min_watch_window_ms: 2000
    fees:
      l1_fee: arbitrum
    assets:
      ethereum:
        address: "0x0000000000000000000000000000000000000000"
        fee_token: true
      # Paxos USDG is the chain's dollar: USDC bridged in arrives as USDG.
      global-dollar:
        address: "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"
        decimals: 6
        fee_token: true
    signers:
      num_signers: 3
