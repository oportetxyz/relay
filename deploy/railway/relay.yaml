# Railway deploy config for the Oportet gas-sponsorship relay (testnet + mainnet).
#
# Baked into the image and loaded with `--config-only`, so this file is
# authoritative for everything EXCEPT secrets, which are read from the env at
# boot (RELAY_MNEMONIC, RELAY_FUNDER_SIGNER_KEY, RELAY_FUNDER_OWNER_KEY,
# RELAY_DB_URL). NEVER put a secret in this file — it ships in the image.
#
# Contract addresses are GLOBAL (one uniform CREATE2 set, identical on every
# chain — testnet + mainnet). Per-chain `endpoint` values here are PUBLIC
# fallbacks; keyed provider URLs are injected at boot from env RPC_<chainId>
# (see config.rs load_from_file), so no keyed RPC ever lands in the image.

server:
  # "::" not "0.0.0.0", for Railway's private network (relay.railway.internal),
  # which is IPv6: an IPv4-only bind is unreachable there. Linux leaves
  # bindv6only off, so this stays dual-stack and IPv4 callers keep working.
  # This is NOT what fixed the healthcheck - that needed PORT=9119 on the
  # service, see deploy/railway/README.md.
  address: "::"
  port: 9119
  metrics_port: 9000
  max_connections: 100

fee_recipient: "0x3824525F5913F1908ce62ea5532C9757Bf3E25A7"
orchestrator: "0x6A9Aa49c955BF766b44979A9e375Bd83e2a8f485"
delegation_proxy: "0x9cEC2E86E7Cb43cB56350d8f928DFC194727E096"
simulator: "0x3006de101E96e85272d5B5Ad07A9738fa7678008"
funder: "0xFC4Cd2DCfF0F1e2781BF9fE7F48378843E176A2e"
escrow: "0xCd075ceb5Cd463a9233a8085fc915767139F655c"

quote:
  # No constantRate: the CoinGecko Pro oracle is live (GECKO_API env on the
  # service). constantRate 1.0 was a testnet stub; on mainnet it would misprice
  # any non-ETH fee token and lie in USD fee reporting.
  gas:
    intentBuffer: 0
    txBuffer: 0
  # 30s: oportet fires prepareCalls immediately before the passkey prompt
  # (verified in RelayActions.sendCalls), so the window only has to cover the
  # human prompt itself - measured 10-30s for PIN fallback, 3-8s for biometric.
  # Price drift inside 30s is absorbed by the quote's fee headroom: alloy's
  # default EIP-1559 estimator prices max_fee at 2x basefee + priority.
  ttl: 30
  # 180s: 3x the 60s CoinGecko poll - survives one failed poll on last-good,
  # fail-closes after ~2 consecutive failures (worst-case stale price ~2.5min).
  rateTtl: 180

# Gas-sponsorship policy (Model A: an approved intent's fee is zeroed and the
# funder pays gas). Mainnet is GATED: every sponsored call needs a verified
# Better Auth identity (quota_key: user, JWT via `auth` below), spends against a
# per-user rolling quota and a per-chain breaker, and a verified user may call
# any target (verified_skips_target_guard) - an anonymous caller stays on the
# per-chain whitelist below. Ceilings are wei of the chain's NATIVE asset and are
# sized per chain under chain_sponsorship (POL on Polygon is not ETH). The
# testnets keep sponsor_all through their overrides.
sponsorship:
  sponsor_all: false
  # 84532 (Base Sepolia) is paused, see its commented block under `chains`.
  sponsored_chains: [1, 137, 4153, 4663, 8453, 11155931]
  quota_key: user
  verified_skips_target_guard: true
  window_hours: 24
  # ETH-chain defaults (Base): ~$0.01-0.02 per intent at 0.006 gwei + L1 data.
  # 0.002 ETH/user/day (~$5, a few hundred intents); 0.1 ETH/day breaker (~$250).
  per_user_wei: "2000000000000000"
  circuit_breaker_wei: "100000000000000000"

chain_sponsorship:
  # Base mainnet: defaults above. Whitelist = what an ANONYMOUS caller may hit.
  8453:
    whitelisted_contracts:
      - "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" # USDC (Circle)
      - "0x000000000022D473030F116dDEE9F6B43aC78BA3" # Permit2
  # Polygon mainnet: gas is POL at ~280 gwei, ~0.1 POL (~$0.01) per intent.
  # 20 POL/user/day (~$2); 1000 POL/day breaker (~$95).
  137:
    per_user_wei: "20000000000000000000"
    circuit_breaker_wei: "1000000000000000000000"
    whitelisted_contracts:
      - "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174" # USDC.e
      - "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359" # USDC (Circle)
      - "0x000000000022D473030F116dDEE9F6B43aC78BA3" # Permit2
      # Polymarket set (apps/expo/src/lib/polymarket/constants.ts)
      - "0xC011a7E12a19f7B1f670d46F03B03f3342E82DFB" # pUSD
      - "0x4D97DCd97eC945f40cF65F87097ACe5EA0476045" # ConditionalTokens
      - "0xE111180000d2663C0091e4f400237545B87B996B" # CTF exchange
      - "0xe2222d279d744050d28e00520010520000310F59" # neg-risk exchange
      - "0xd91E80cF2E7be2e162c6513ceD06f1dD0dA35296" # neg-risk adapter
      - "0x3A3BD7bb9528E159577F7C2e685CC81A765002E2" # wrapped collateral
      - "0x93070a847efEf7F70739046A929D47a521F5B8ee" # collateral onramp
      - "0x2957922Eb93258b93368531d39fAcCA3B4dC5854" # collateral offramp
      - "0xAdA100Db00Ca00073811820692005400218FcE1f" # CTF collateral adapter
      - "0xadA2005600Dec949baf300f4C6120000bDB6eAab" # neg-risk CTF collateral adapter
      - "0x00000000000Fb5C9ADea0298D729A0CB3823Cc07" # deposit-wallet factory
  # Rise mainnet: gas is dust (0.0004 gwei), ~1e-7 ETH per intent.
  # 0.0005 ETH/user/day (~$1.2, thousands of intents); 0.02 ETH/day breaker (~$50).
  4153:
    per_user_wei: "500000000000000"
    circuit_breaker_wei: "20000000000000000"
    whitelisted_contracts:
      # RiseX mainnet (apps/expo/src/lib/constants.ts RISEX_MAINNET_CONTRACTS)
      - "0x53f10fAcFC8965750494E6965F5d6dA39B41d852" # PerpsManager
      - "0x0D919DAA3f12AE715744Eb648c00066c5DBd66f0" # Auth
      - "0xe436820ba0C69702c1d3E601d421c0eF38262739" # USDC.e
      - "0x2C03C7d7e2974C6599b6B108879109281ef3F818" # CollateralManager
      - "0x11541dc387b9C307043ea732127DF92b80bab52b" # FeeManager
      - "0x000000000022D473030F116dDEE9F6B43aC78BA3" # Permit2
  # Ethereum mainnet: the only chain where gas is genuinely expensive and
  # volatile. Both ceilings are set by what the funder holds (~0.011 ETH), not by
  # appetite: the global 0.1 ETH breaker would never trip, the funder would just
  # empty and every sponsored call would start failing outright. 0.005 ETH/day
  # breaker keeps ~half the balance in reserve.
  # At 0.05 gwei a ~300k-gas intent costs ~1.5e-5 ETH, so 0.001 ETH/user/day is
  # dozens of intents. At 5 gwei it is one, and above ~15 gwei the per-user cap
  # denies the first call. That is deliberate - it fails closed on a gas spike
  # rather than draining the funder. Raise both together with the balance.
  1:
    per_user_wei: "1000000000000000"
    circuit_breaker_wei: "5000000000000000"
    whitelisted_contracts:
      - "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" # USDC (Circle)
      - "0x000000000022D473030F116dDEE9F6B43aC78BA3" # Permit2
  # Robinhood mainnet: Arbitrum Orbit, so the L1 data fee dominates the 0.09 gwei
  # execution price. Funder holds ~0.008 ETH, breaker sized under it for the same
  # reason as Ethereum.
  4663:
    per_user_wei: "500000000000000"
    circuit_breaker_wei: "4000000000000000"
    whitelisted_contracts:
      - "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168" # USDG (Global Dollar)
      - "0x000000000022D473030F116dDEE9F6B43aC78BA3" # Permit2
  # Testnets stay open: the faucet, the e2e fork and the dev loop rely on it.
  # 84532 is paused, see its commented block under `chains`.
  # 84532:
  #   sponsor_all: true
  11155931:
    sponsor_all: true

# Better Auth JWKS for verifying user bearer tokens. Load-bearing on mainnet
# now: quota_key is user, so an absent or unverifiable bearer is DENIED
# sponsorship and the user pays the fee token. The app attaches the JWT on every
# relay call (apps/expo/src/lib/porto.ts setRelayAuthToken). Unknown kids
# refresh the JWKS once, so key rotation needs no restart. The dev hatch
# (dev_api_key) stays off: dev builds carry real JWTs.
# CoinGecko has no coin called "pol": without this remap POL never gets a USD
# price, every Polygon fee token fails its native conversion, and
# wallet_getCapabilities lists only the native token on 137.
pricefeed:
  coingecko:
    remapping:
      pol: polygon-ecosystem-token

auth:
  jwks_url: "https://onramp.xyz/api/auth/jwks"

# Passkey association files, served at https://id.oportet.xyz/.well-known/ so
# that host can become the app's WebAuthn rpId. Each entry lets an app use the
# passkeys bound to this domain, so list only apps we sign. The Apple team and
# iOS bundle id are the ones in apps/expo/app.config.ts. The Android fingerprints are the same set
# onramp.xyz trusts for com.onramp.app, from the monorepo's
# apps/next/public/.well-known/assetlinks.json. Changes need a relay deploy.
